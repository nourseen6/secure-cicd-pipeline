services:
  jenkins:
    build: .
    container_name: jenkins
    ports:
      - "8080:8080"
    environment:
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?Set JENKINS_ADMIN_PASSWORD in jenkins/.env}
    # Pipeline steps start their own containers (Python, gitleaks, Trivy)
    # on the host's Docker engine. Access to the socket is powerful — this
    # setup is for a local lab, not a shared server.
    volumes:
      - jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-1001}"
    restart: unless-stopped

volumes:
  jenkins-home:
